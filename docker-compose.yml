services:
  matching:
    build: .
    command: uvicorn hanwoo.services.matching.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8888:8000"
    environment:
      HANWOO_DEVICE: auto
      MATCHING_MODEL_PATH: /app/models/matching/encoder_old.pt
      HANWOO_STORAGE_DIR: /app/storage/matching
      U2NET_HOME: /app/models/u2net
      DEFAULT_TOP_K: 5
      HANWOO_API_KEY: ${HANWOO_API_KEY:?Set HANWOO_API_KEY in .env}
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: hanwoo_matching_gallery
      VALIDATOR_URL: http://localhost:8501/validator
    volumes:
      - ./models:/app/models:ro
      - ./storage:/app/storage
    depends_on:
      - qdrant

  anomaly:
    build: .
    command: uvicorn hanwoo.services.anomaly.main:app --host 0.0.0.0 --port 8001
    ports:
      - "8889:8001"
    environment:
      HANWOO_DEVICE: auto
      ANOMALY_MODEL_PATH: /app/models/anomaly/memory_bank.pth
      ANOMALY_THRESHOLD_PATH: /app/models/anomaly/threshold.json
      U2NET_HOME: /app/models/u2net
      HANWOO_API_KEY: ${HANWOO_API_KEY:?Set HANWOO_API_KEY in .env}
      VALIDATOR_URL: http://localhost:8501/validator
    volumes:
      - ./models:/app/models:ro
      - ./storage:/app/storage

  dinomaly:
    build: .
    command: uvicorn hanwoo.services.dinomaly.main:app --host 0.0.0.0 --port 8002
    ports:
      - "8890:8002"
    environment:
      HANWOO_DEVICE: auto
      DINOMALY_MODEL_PATH: /app/models/dinomaly/best_model.pth
      DINOMALY_THRESHOLD: 0.21
      DINOMALY_SCORE_MODE: roi_max
      U2NET_HOME: /app/models/u2net
      HANWOO_API_KEY: ${HANWOO_API_KEY:?Set HANWOO_API_KEY in .env}
    volumes:
      - ./models:/app/models:ro

  validator:
    build: .
    command: >
      streamlit run src/hanwoo/services/validator/streamlit_app.py
      --server.address=0.0.0.0
      --server.port=8501
      --server.baseUrlPath=validator
      --server.maxUploadSize=1024
      --browser.gatherUsageStats=false
    ports:
      - "8501:8501"
    environment:
      MATCHING_API_BASE_URL: http://matching:8000
      ANOMALY_API_BASE_URL: http://anomaly:8001
      HANWOO_API_KEY: ${HANWOO_API_KEY:?Set HANWOO_API_KEY in .env}
    volumes:
      - ./storage:/app/storage
    depends_on:
      - matching
      - anomaly

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  qdrant_data:
